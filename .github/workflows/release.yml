name: Release

# Prepare from main, validate that commit, then push and publish it unchanged.
# A newer push can supersede a queued run; every run checks what it will ship.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish @nannier-com/lookout to npm"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.npm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Read Changesets' own parsed plan. A regex misses valid YAML spellings
      # of major, and a manual rerun must not bypass the version policy.
      - name: Check the release plan
        id: plan
        run: |
          bun run changeset status --output "$RUNNER_TEMP/lookout-release-plan.json"
          bun tools/release/plan.ts "$RUNNER_TEMP/lookout-release-plan.json"

      - name: Prepare the release commit
        id: prepare
        env:
          CHANGESET_COUNT: ${{ steps.plan.outputs.changesets }}
        run: |
          # Changesets creates an annotated tag even when recovering a version
          # with no pending changesets, so that path needs an identity too.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANGESET_COUNT" != "0" ]; then
            bun run version-packages
            git add -- package.json CHANGELOG.md .changeset
            if ! git diff --cached --quiet; then
              git commit -m "chore: version packages [skip ci]"
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Validate the prepared release
        id: validate
        uses: ./.github/actions/validate

      # This is the last git operation that can affect main. If main advanced,
      # fail before publishing: the newer push has its own release run. Never
      # rebase here, since that would change the code the checks just passed.
      - name: Push the validated commit
        id: push
        env:
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error::The checkout changed during validation; nothing will be published."
            exit 1
          fi
          git push origin HEAD:main

      - name: Authenticate npm (npmjs.org)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc

      # No pending changesets is still a validated attempt to publish a version
      # already on main but missing from npm. Changesets leaves published ones
      # alone. Neither this path nor a manual rerun bypasses validation.
      - name: Publish to npmjs.org
        id: publish
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        id: tags
        run: git push --tags

      - name: Summarise the release
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          TAGS_OUTCOME: ${{ steps.tags.outcome }}
        run: |
          {
            echo "### npm"
            case "$PUBLISH_OUTCOME" in
              success)
                echo "Release command succeeded for **@nannier-com/lookout@$RELEASE_VERSION**."
                echo "Already published versions are left unchanged."
                if [ "$TAGS_OUTCOME" != "success" ]; then
                  echo "Release is incomplete: pushing the release tags did not succeed."
                fi
                ;;
              failure)
                echo "Publishing failed. Inspect the publish step for the registry outcome."
                ;;
              *)
                echo "Publishing did not run successfully. Inspect the preceding steps."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
